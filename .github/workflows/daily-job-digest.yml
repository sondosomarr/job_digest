name: Daily Job Digest

on:
  schedule:
    # Runs at 06:00 UTC every day = 8am Cairo (winter) / 9am Cairo (summer).
    # Change the "06:00" below to shift the time. Cron is always in UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit tracker.xlsx back

jobs:
  update-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job digest
        run: python job_digest.py

      - name: Commit updated tracker
        run: |
          git config user.name "job-digest-bot"
          git config user.email "actions@github.com"
          git add tracker.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily job digest update ($(date -u +%Y-%m-%d))"
            git push
          fi
